name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt
      - name: Lint
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/smaca
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  bioconda-pr:
    needs: publish-pypi   # wait until package is live on PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Fetch SHA256 from PyPI
        run: |
          SHA256=$(curl -s https://pypi.org/pypi/smaca/${VERSION}/json \
            | jq -r '.urls[] | select(.packagetype=="sdist") | .digests.sha256')
          echo "SHA256=${SHA256}" >> $GITHUB_ENV

      - name: Checkout bioconda-recipes
        uses: actions/checkout@v4
        with:
          repository: bioconda/bioconda-recipes
          token: ${{ secrets.GH_PAT }}
          path: bioconda-recipes

      - name: Update recipe
        working-directory: bioconda-recipes
        run: |
          sed -i "s/^{% set version = .* %}/{% set version = \"${VERSION}\" %}/" recipes/smaca/meta.yaml
          sed -i "s/sha256: .*/sha256: ${SHA256}/" recipes/smaca/meta.yaml

      - name: Create pull request
        working-directory: bioconda-recipes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b smaca-${VERSION}
          git add recipes/smaca/meta.yaml
          git commit -m "Update smaca to ${VERSION}"
          git push origin smaca-${VERSION}
          gh pr create \
            --repo bioconda/bioconda-recipes \
            --title "Update smaca to ${VERSION}" \
            --body "Automated version bump from https://github.com/babelomics/SMAca/releases/tag/v${VERSION}" \
            --head smaca-${VERSION} \
            --base master
